[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cv-cue-mcp"
version = "0.1.0"
description = "MCP server for Arista CV-CUE (CloudVision Cognitive Unified Edge) — curated tools + full API discovery"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["mcp", "arista", "cv-cue", "cloudvision", "wifi", "networking", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: System :: Networking",
]
dependencies = [
    "mcp[cli]>=1.6.0,<2",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/sharanmahadevan/cv-cue-mcp"
Issues = "https://github.com/sharanmahadevan/cv-cue-mcp/issues"

[project.optional-dependencies]
http = [
    "uvicorn[standard]>=0.30.0",
    "starlette>=0.40.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.4.0",
]

[project.scripts]
cv-cue-mcp = "cvcue_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cvcue_mcp"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint.per-file-ignores]
"src/cvcue_mcp/tools/*.py" = ["E501"]   # tool signatures carry long Field descriptions
