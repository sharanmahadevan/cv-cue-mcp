# Fly.io config for the hosted CV-CUE MCP app (sign-in + OAuth + MCP endpoint).
# Users' CV-CUE keys are stored AES-GCM encrypted in SQLite on the volume below.
# Required secrets (fly secrets set ...): CVCUE_MASTER_KEY, CVCUE_SESSION_SECRET,
# GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET. Change `app` and CVCUE_PUBLIC_URL for your own deploy.

app = "cv-cue-mcp"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  MCP_TRANSPORT = "hosted"
  CVCUE_PUBLIC_URL = "https://cv-cue-mcp.fly.dev"
  CVCUE_DB_PATH = "/data/cvcue.db"
  PORT = "8080"
  LOG_LEVEL = "INFO"
  # Ceiling for mutating calls. When "true", users can turn writes on per connection
  # (raw-key callers must send `X-CVCUE-Enable-Writes: true`).
  CVCUE_ENABLE_WRITES = "true"
  # Only these CV-CUE hosts may be targeted via X-CVCUE-Base-URL (SSRF guard).
  CVCUE_ALLOWED_HOST_SUFFIXES = ".wifi.arista.com"
  CVCUE_REDACT_SECRETS = "true"
  CVCUE_POOL_MAX = "256"
  CVCUE_POOL_IDLE_TTL = "900"
  CVCUE_SOURCE_URL = "https://github.com/sharanmahadevan/cv-cue-mcp"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

# SQLite lives here — keep exactly one machine (fly scale count 1).
[mounts]
  source = "cvcue_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
